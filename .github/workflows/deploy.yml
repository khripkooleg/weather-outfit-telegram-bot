name: "Deploy a Python Telegram Bot Application"

on:
    push:
        branches: ['develop', 'master']
        tags: ['v*']
    pull_request:
        branches: ['develop', 'master']

env:
  AWS_REGION: eu-north-1

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version: ['3.11', '3.13']
        name: "Perform Lint and Test on Python Code"
        steps:
            - name: "Checkout Code"
              uses: "actions/checkout@v4"
            
            - name: "Install Python"
              uses: "actions/setup-python@v5"
              with:
                cache: 'pip'
                python-version: ${{ matrix.python-version }}
                architecture: "x64"
            
            - name: "Install Python Dependencies"
              run: |
                python -m pip install --upgrade pip |
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            
            - name: "Perform Ruff Check and Format Verification"
              continue-on-error: true
              run: |
                ruff check --fix src/
                ruff format src/
    build-and-push:
        runs-on: ubuntu-latest
        needs: lint-and-test
        name: "Build and Deploy Python Image to Docker Hub"
        steps:
            - name: "Checkout Code"
              uses: "actions/checkout@v4"

            - name: "Log In to Docker Hub"
              uses: "docker/login-action@v3"
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: "Configure AWS Credentials"
              uses: "aws-actions/configure-aws-credentials@v4"
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ secrets.AWS_REGION }}

            - name: "Log In to Amazon ECR"
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2

            - name: "Set Up Docker Buildx"
              uses: "docker/setup-buildx-action@v3"
            
            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ steps.login-ecr.outputs.registry }}/telegram-ecr-repository
                tags: |
                    type=raw,value=latest
                    type=sha,format=short

            - name: "Build and push to AWS ECR"
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max
    deploy:
        runs-on: ubuntu-latest
        needs: build-and-push
        if: github.event_name == 'push'
        name: "Deploy to EC2 via Docker Compose"
        steps:
        - name: "Deploy to EC2 via SSH"
          uses: appleboy/ssh-action@v1.0.3
          with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USERNAME }}
            key: ${{ secrets.EC2_SSH_KEY }}
            port: ${{ secrets.EC2_PORT || 22 }}
            script: |
                aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
                docker login --username AWS --password-stdin $(aws sts get-caller-identity --query Account --output text).dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

                cd ~/app
                docker compose pull
                docker compose up -d --remove-orphans