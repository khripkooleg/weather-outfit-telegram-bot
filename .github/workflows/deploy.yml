name: "Deploy a Python Telegram Bot Application"

on:
    push:
        branches: ['develop', 'master']
        tags: ['v*']
    pull_request:
        branches: ['develop', 'master']

jobs:
    lint-and-test:
        runs-on: ubuntu-latest
        strategy:
          fail-fast: false
          matrix:
            python-version: ['3.11', '3.13']
        name: "Perform Lint and Test on Python Code"
        steps:
            - name: "Checkout Code"
              uses: "actions/checkout@v4"
            
            - name: "Install Python"
              uses: "actions/setup-python@v5"
              with:
                cache: 'pip'
                python-version: ${{ matrix.python-version }}
                architecture: "x64"
            
            - name: "Install Python Dependencies"
              run: |
                python -m pip install --upgrade pip |
                if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            
            - name: "Perform Ruff Check and Format Verification"
              continue-on-error: true
              run: |
                ruff check --fix src/
                ruff format src/
    build-and-push:
        runs-on: ubuntu-latest
        needs: lint-and-test
        name: "Build and Deploy Python Image to Docker Hub"
        steps:
            - name: "Checkout Code"
              uses: "actions/checkout@v4"

            - name: "Log In to Docker Hub"
              uses: "docker/login-action@v3"
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name: "Set Up Docker Buildx"
              uses: "docker/setup-buildx-action@v3"
            
            - name: Extract metadata for Docker
              id: meta
              uses: docker/metadata-action@v5
              with:
                images: ${{ secrets.DOCKER_USERNAME }}/weather-outfit-telegram-bot
                tags: |
                    type=raw,value=latest
                    type=sha,format=short

            - name: Build and push to Docker Hub
              uses: docker/build-push-action@v5
              with:
                context: .
                push: true
                tags: ${{ steps.meta.outputs.tags }}
                labels: ${{ steps.meta.outputs.labels }}
                cache-from: type=gha
                cache-to: type=gha,mode=max