services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tg_weather_bot
    env_file:
      - .env
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
          